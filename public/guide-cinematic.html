"},"photo-semey":{"ru":"Фотография музея Алаш","kk":"Алаш музейінің фотосуреті","en":"Photograph of the Alash museum","url":"https://commons.wikimedia.org/wiki/File:Alash_arystary_museum.jpg"},"photo-zhidebay":{"ru":"Фотография комплекса Абай–Шакарим","kk":"Абай–Шәкәрім кешенінің фотосуреті","en":"Photograph of the Abai–Shakarim complex","url":"https://commons.wikimedia.org/wiki/File:Abai_%26_Shakarim_mausoleum.jpg"},"photo-kozy":{"ru":"Фотография мавзолея","kk":"Кесененің фотосуреті","en":"Photograph of the mausoleum","url":"https://commons.wikimedia.org/wiki/File:Kozy_Korpesh_%E2%80%94_Bayan_Sulu_mausoleum.JPG"},"loc":{"ru":"Вид Семипалатинска, 1885–1886","kk":"Семей көрінісі, 1885–1886","en":"A view of Semipalatinsk, 1885–1886","url":"https://www.loc.gov/item/99615482/"},"khanate":{"ru":"Образование Казахского ханства","kk":"Қазақ хандығының құрылуы","en":"The formation of the Kazakh Khanate","url":"https://e-history.kz/ru/amp/history-of-kazakhstan/show/9173"},"constitution":{"ru":"Исторические документы Конституции 1995 года","kk":"1995 жылғы Конституцияның тарихи құжаттары","en":"Historical documents of the 1995 Constitution","url":"https://archive.president.kz/ru/virtual/istoriko-dokumentalnaya-vystavka-konstitutsiya-respubliki-kazakhstan-osnova-stabilnosti-i-protsvetan/"},"independence":{"ru":"История провозглашения Независимости","kk":"Тәуелсіздіктің жариялану тарихы","en":"The proclamation of independence","url":"https://www.gov.kz/memleket/entities/almaty/press/news/details/289236?lang=ru"},"egov":{"ru":"Учреждения культуры области Абай","kk":"Абай облысының мәдениет мекемелері","en":"Cultural institutions in Abai Region","url":"https://data.egov.kz/datasets/view?index=729_perechen_gosudarstvennyh1"},"population":{"ru":"Демографический ежегодник Казахстана, 2025","kk":"Қазақстанның демографиялық жылнамасы, 2025","en":"Demographic yearbook of Kazakhstan, 2025","url":"https://stat.gov.kz/upload/iblock/ba9/sb7y28tuj2cfxl7qhnsb1uc8gzfx1nna/%D0%95-06-%D0%93%20%D1%80%D1%83%D1%81.pdf"},"culture":{"ru":"Статистика культуры за 2025 год","kk":"2025 жылғы мәдениет статистикасы","en":"Culture statistics for 2025","url":"https://stat.gov.kz/ru/industries/social-statistics/stat-culture/publications/341122/"},"registry":{"ru":"Государственный список памятников области","kk":"Облыс ескерткіштерінің мемлекеттік тізімі","en":"State register of regional monuments","url":"https://old.adilet.zan.kz/rus/docs/G26F000063A"},"boundary":{"ru":"Граница области Абай","kk":"Абай облысының шекарасы","en":"Abai Region boundary","url":"https://www.openstreetmap.org/relation/14243026"},"terrain":{"ru":"Данные рельефа","kk":"Жер бедері деректері","en":"Terrain elevation data","url":"https://mapterhorn.com/attribution/"},"basemap":{"ru":"Географическая основа","kk":"Географиялық негіз","en":"Geographic basemap","url":"https://openfreemap.org/quick_start/"}};
    const svgPaths = {
      restart:'<path d="M3 11a9 9 0 1 1 2.7 6.4M3 4v7h7"/>',
      arrow:'<path d="M7 17 17 7M7 7h10v10"/>',
      send:'<path d="M12 19V5m-6 6 6-6 6 6"/>',
      stop:'<rect x="6" y="6" width="12" height="12" rx="1"/>',
      pause:'<path d="M9 5v14M15 5v14"/>',
      play:'<path d="m9 5 10 7-10 7V5Z"/>',
      landmark:'<path d="m3 9 9-6 9 6H3Zm2 2v7m5-7v7m4-7v7m5-7v7M3 21h18"/>',
      book:'<path d="M12 5c-3-2-6-2-10-1v15c4-1 7-1 10 1 3-2 6-2 10-1V4c-4-1-7-1-10 1Zm0 0v15"/>',
      map:'<path d="m9 18-6 3V6l6-3 6 3 6-3v15l-6 3-6-3Zm0 0V3m6 3v15"/>'
    };
    function icon(name){const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('viewBox','0 0 24 24');svg.setAttribute('fill','none');svg.setAttribute('stroke','currentColor');svg.setAttribute('stroke-width','1.6');svg.setAttribute('stroke-linecap','round');svg.setAttribute('stroke-linejoin','round');svg.setAttribute('aria-hidden','true');svg.innerHTML=svgPaths[name]||svgPaths.arrow;return svg;}
    function node(tag,className,text){const element=document.createElement(tag);if(className)element.className=className;if(text!==undefined)element.textContent=text;return element;}
    let lang='ru',placeId='semey',active=null,pendingQuestion='',failedQuestion='',failureCopy='',generation=0;
    const conversations=new Map();
    const currentKey=()=>lang+':'+placeId;
    const currentTurns=()=>conversations.get(currentKey())||[];
    const t=()=>copy[lang];
    function publicLink(value){if(typeof value!=='string'||value.length>2048)return false;try{const url=new URL(value),host=url.hostname.toLowerCase();return url.protocol==='https:'&&!url.username&&!url.password&&host.includes('.')&&!/^(localhost|127\.|0\.|10\.|192\.168\.|169\.254\.|172\.(1[6-9]|2\d|3[01])\.)/.test(host)&&!host.endsWith('.local')&&!host.endsWith('.localhost');}catch{return false;}}
    function validateAnswer(data){
      if(!data||typeof data!=='object'||typeof data.answer!=='string'||!data.answer.trim()||data.answer.length>12000)throw new Error('Invalid answer');
      const citationIds=Array.isArray(data.citationIds)?data.citationIds.filter(id=>typeof id==='string'&&Object.hasOwn(sources,id)):[];
      const links=[];
      if(Array.isArray(data.links))for(const link of data.links.slice(0,40)){if(link&&typeof link==='object'&&Number.isInteger(link.start)&&Number.isInteger(link.end)&&link.start>=0&&link.end>link.start&&link.end<=data.answer.length&&publicLink(link.url)&&typeof link.title==='string'&&link.title.length<=200&&/^\[\d+\]$/.test(data.answer.slice(link.start,link.end))&&!links.some(other=>link.start<other.end&&link.end>other.start))links.push({start:link.start,end:link.end,url:link.url,title:link.title});}
      links.sort((a,b)=>a.start-b.start);
      const basis=['general','web','project'].includes(data.basis)?data.basis:undefined;
      if(basis==='project'&&!citationIds.length||basis==='web'&&!links.length||!citationIds.length&&!links.length&&basis!=='general'&&data.supported!==false)throw new Error('Missing source');
      return {answer:data.answer,citationIds,links,basis};
    }
    function sourceAnchor(source){const link=node('a','source-link');link.href=source.url;link.target='_blank';link.rel='noopener noreferrer';link.append(node('span','',source[lang]||source.en),icon('arrow'));return link;}
    function sourceList(ids){const list=node('div','sources');list.setAttribute('aria-label',t().sources);for(const id of [...new Set(ids)]){const source=sources[id];if(source&&publicLink(source.url))list.append(sourceAnchor(source));}return list;}
    function renderAnswer(answer){
      const wrapper=node('div','answer');const label=node('div','answer-label');label.append(icon('book'),node('span','',t().name));wrapper.append(label);
      const paragraph=node('p');let cursor=0;
      for(const link of answer.links){paragraph.append(document.createTextNode(answer.answer.slice(cursor,link.start)));const citation=node('a','inline-source',answer.answer.slice(link.start,link.end));citation.href=link.url;citation.target='_blank';citation.rel='noopener noreferrer';citation.title=link.title;citation.setAttribute('aria-label',link.title);paragraph.append(citation);cursor=link.end;}
      paragraph.append(document.createTextNode(answer.answer.slice(cursor)));wrapper.append(paragraph);
      const extra=answer.citationIds.filter(id=>!answer.links.some(link=>link.url===sources[id].url));if(extra.length)wrapper.append(sourceList(extra));
      if(answer.basis==='general')wrapper.append(node('div','basis',t().general));return wrapper;
    }
    function renderThread(){
      const thread=$('thread');thread.replaceChildren();thread.setAttribute('aria-label',t().name);thread.setAttribute('aria-busy',String(Boolean(active)));
      const turns=currentTurns();$('welcome').hidden=Boolean(turns.length||pendingQuestion||failedQuestion);
      for(const turn of turns){const group=node('article','turn');const question=node('p','question',turn.question);question.setAttribute('aria-label',t().you);group.append(question,renderAnswer(turn.answer));thread.append(group);}
      if(pendingQuestion||failedQuestion){const question=node('p','question',pendingQuestion||failedQuestion);question.setAttribute('aria-label',t().you);thread.append(question);}
      if(active){const thinking=node('div','thinking');thinking.setAttribute('role','status');thinking.append(node('span','thinking-dot'),node('span','',t().preparing));thread.append(thinking);}
      if(failedQuestion){const error=node('div','error-box');error.setAttribute('role','status');error.append(node('p','',failureCopy||t().unavailable));const retry=node('button','retry',t().retry);retry.type='button';retry.addEventListener('click',()=>void ask(failedQuestion));error.append(retry,sourceList(places.find(place=>place.id===placeId).sources));thread.append(error);}
      updateComposer();requestAnimationFrame(()=>{$('content').scrollTop=turns.length||pendingQuestion||failedQuestion?$('content').scrollHeight:0;});
    }
    function updateComposer(){const button=$('send');button.replaceChildren(icon(active?'stop':'send'),node('span','',active?t().stop:t().send));button.disabled=!active&&!$('question').value.trim();button.setAttribute('aria-label',active?t().stop:t().send);button.title=active?t().stop:t().send;$('question').disabled=Boolean(active);$('question-form').setAttribute('aria-busy',String(Boolean(active)));}
    function renderInterface(){
      document.documentElement.lang=lang;document.title=t().name+' — IZQOR';
      for(const [id,key]of [['guide-name','name'],['guide-subtitle','subtitle'],['place-label','place'],['welcome-title','welcome'],['welcome-copy','introduction'],['question-label','placeholder']])$(id).textContent=t()[key];
      $('question').placeholder=t().placeholder;$('place-select').setAttribute('aria-label',t().place);
      $('place-select').replaceChildren(...places.map(place=>{const option=node('option','',place[lang]);option.value=place.id;return option;}));$('place-select').value=placeId;
      const restart=$('new-conversation');restart.replaceChildren(icon('restart'),node('span','',t().newConversation));restart.setAttribute('aria-label',t().newConversation);restart.title=t().newConversation;
      for(const button of document.querySelectorAll('[data-language]'))button.setAttribute('aria-pressed',String(button.dataset.language===lang));
      $('suggestions').replaceChildren(...t().prompts.map((prompt,index)=>{const button=node('button','suggestion');button.type='button';button.append(icon(['landmark','book','map'][index]),node('span','',prompt),icon('arrow'));button.addEventListener('click',()=>void ask(prompt));return button;}));
      updateBackgroundButton();renderThread();
    }
    function history(turns){const recent=turns.slice(-4).map(turn=>({question:turn.question,answer:turn.answer.answer.slice(0,6000)}));while(recent.length&&recent.reduce((sum,turn)=>sum+turn.question.length+turn.answer.length,0)>24000)recent.shift();return recent.flatMap(turn=>[{role:'user',content:turn.question},{role:'assistant',content:turn.answer}]);}
    function cancelRequest(restore){generation++;const previous=pendingQuestion;if(active){clearTimeout(active.timer);active.controller.abort();}active=null;pendingQuestion='';if(restore&&previous){$('question').value=previous;$('status-note').textContent=t().stopped;}return previous;}
    async function ask(value){
      const question=value.trim();if(!question||question.length>1200||active)return;
      const requestLang=lang,requestPlace=placeId,key=currentKey(),turns=currentTurns(),current=++generation,controller=new AbortController();let timedOut=false;
      const timer=setTimeout(()=>{timedOut=true;controller.abort();},60000);active={controller,timer};pendingQuestion=question;failedQuestion='';failureCopy='';$('question').value='';$('question').style.height='';$('status-note').textContent='';renderThread();
      try{
        const response=await fetch('/api/guide',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question,locale:requestLang,placeId:requestPlace,history:history(turns)}),signal:controller.signal,credentials:'same-origin'});
        if(!response.ok)throw new Error('Guide unavailable');
        const answer=validateAnswer(await response.json());if(current!==generation)return;
        conversations.set(key,[...turns,{question,answer}].slice(-6));pendingQuestion='';
      }catch{if(current!==generation)return;failedQuestion=question;pendingQuestion='';failureCopy=timedOut?t().timeout:t().unavailable;}
      finally{clearTimeout(timer);if(current===generation){active=null;renderThread();$('question').focus({preventScroll:true});}}
    }
    $('question-form').addEventListener('submit',event=>{event.preventDefault();if(active){cancelRequest(true);renderThread();$('question').focus({preventScroll:true});}else void ask($('question').value);});
    $('question').addEventListener('input',()=>{$('status-note').textContent='';$('question').style.height='auto';$('question').style.height=Math.min($('question').scrollHeight,110)+'px';updateComposer();});
    $('question').addEventListener('keydown',event=>{if(event.key==='Enter'&&!event.shiftKey&&!event.isComposing){event.preventDefault();if(!active)void ask($('question').value);}});
    $('new-conversation').addEventListener('click',()=>{cancelRequest(false);conversations.delete(currentKey());failedQuestion='';failureCopy='';$('question').value='';$('question').style.height='';$('status-note').textContent='';renderThread();$('question').focus({preventScroll:true});});
    $('place-select').addEventListener('change',event=>{cancelRequest(false);placeId=event.target.value;failedQuestion='';$('question').value='';$('status-note').textContent='';renderThread();});
    for(const button of document.querySelectorAll('[data-language]'))button.addEventListener('click',()=>{if(lang===button.dataset.language)return;cancelRequest(false);lang=button.dataset.language;failedQuestion='';$('question').value='';$('status-note').textContent='';renderInterface();});
    const video=$('landscape'),motion=matchMedia('(prefers-reduced-motion: reduce)');let wantedVideo=!motion.matches,videoReady=false;
    function updateBackgroundButton(){const button=$('background-toggle');button.hidden=!videoReady;const playing=!video.paused;button.replaceChildren(icon(playing?'pause':'play'));button.setAttribute('aria-label',playing?t().pause:t().play);button.title=playing?t().pause:t().play;button.setAttribute('aria-pressed',String(playing));}
    function playBackground(){if(!videoReady||document.hidden||!wantedVideo)return;video.play().catch(()=>{wantedVideo=false;updateBackgroundButton();});}
    if(motion.matches)video.pause();
    video.addEventListener('loadeddata',()=>{videoReady=true;video.dataset.ready='true';if(!wantedVideo)video.pause();else playBackground();updateBackgroundButton();});
    video.addEventListener('error',()=>{videoReady=false;video.dataset.ready='false';updateBackgroundButton();});
    video.querySelector('source').addEventListener('error',()=>{videoReady=false;video.dataset.ready='false';updateBackgroundButton();});
    video.addEventListener('play',updateBackgroundButton);video.addEventListener('pause',updateBackgroundButton);
    $('background-toggle').addEventListener('click',()=>{wantedVideo=video.paused;if(wantedVideo)playBackground();else video.pause();updateBackgroundButton();});
    motion.addEventListener('change',()=>{wantedVideo=!motion.matches;if(!wantedVideo)video.pause();else playBackground();updateBackgroundButton();});
    document.addEventListener('visibilitychange',()=>{if(document.hidden)video.pause();else playBackground();});
    window.addEventListener('pagehide',()=>{cancelRequest(false);video.pause();});
    renderInterface();
  </script>
<script>
(()=>{const toggle=document.getElementById('mobile-menu-toggle'),menu=document.getElementById('mobile-menu');const labels={ru:{journey:'Путешествие',map:'Карта',stories:'Истории',sources:'Источники',menu:'Открыть меню'},kk:{journey:'Саяхат',map:'Карта',stories:'Орындар',sources:'Дереккөздер',menu:'Мәзірді ашу'},en:{journey:'Journey',map:'Atlas',stories:'Stories',sources:'Sources',menu:'Open menu'}};function close(){menu.hidden=true;toggle.setAttribute('aria-expanded','false')}toggle.addEventListener('click',()=>{menu.hidden=!menu.hidden;toggle.setAttribute('aria-expanded',String(!menu.hidden))});menu.addEventListener('click',event=>{if(event.target.closest('a,[data-language]'))close()});document.addEventListener('keydown',event=>{if(event.key==='Escape'&&!menu.hidden){close();toggle.focus()}});addEventListener('resize',()=>{if(innerWidth>=768)close()});for(const button of document.querySelectorAll('[data-language]'))button.addEventListener('click',()=>{const copy=labels[button.dataset.language]||labels.ru;for(const link of document.querySelectorAll('[data-nav]'))link.textContent=copy[link.dataset.nav];toggle.setAttribute('aria-label',copy.menu)})})();
